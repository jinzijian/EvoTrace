name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run python -m unittest discover -s tests -v

      - name: Lint
        run: uvx ruff check src tests

      - name: Build
        run: uv build

  windows-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install through PowerShell entrypoint
        shell: pwsh
        env:
          EVOTRACE_INSTALL_SOURCE: ${{ github.workspace }}
          UV_TOOL_DIR: ${{ runner.temp }}/evotrace-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/evotrace-bin
        run: |
          ./install.ps1
          & "$env:UV_TOOL_BIN_DIR/evotrace.exe" --version
