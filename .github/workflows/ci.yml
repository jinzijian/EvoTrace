name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run python -m unittest discover -s tests -v

      - name: Lint
        run: uvx ruff check src tests

      - name: Build
        run: uv build

  harness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verify one-line installer release payload
        run: git ls-files --error-unmatch package.json pnpm-lock.yaml harness/launcher.mjs harness/presets/evotrace-orchestrator/agent.cordis.yml

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install compiler and Harness
        run: |
          uv sync --locked
          npm install --global pnpm@10.30.1
          pnpm install --frozen-lockfile

      - name: Test Harness composition and role tools
        run: pnpm test:harness

      - name: Check integrated runtime
        run: pnpm harness:doctor

  windows-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install --global pnpm@10.30.1

      - name: Install through PowerShell entrypoint
        shell: pwsh
        env:
          EVOTRACE_INSTALL_SOURCE: ${{ github.workspace }}
          EVOTRACE_INSTALL_ROOT: ${{ runner.temp }}/evotrace-app
          EVOTRACE_BIN_DIR: ${{ runner.temp }}/evotrace-bin
        run: |
          ./install.ps1
          & "$env:EVOTRACE_BIN_DIR/evotrace.cmd" doctor
