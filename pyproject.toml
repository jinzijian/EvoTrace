[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evotrace"
version = "0.8.0"
description = "Compile real-world coding-agent trajectories into verified post-training assets."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "EvoTrace contributors"},
]
keywords = [
  "agents",
  "benchmark",
  "coding-agents",
  "evaluation",
  "reinforcement-learning",
  "verifier",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "prompt-toolkit>=3.0,<4",
]

[project.urls]
Homepage = "https://github.com/jinzijian/EvoTrace"
Repository = "https://github.com/jinzijian/EvoTrace"
Issues = "https://github.com/jinzijian/EvoTrace/issues"

[project.scripts]
evotrace = "evotrace.cli:main"
et = "evotrace.cli:main"
scaleverifier = "evotrace.cli:main"
sv = "evotrace.cli:main"
vf = "evotrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evotrace", "src/scaleverifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
